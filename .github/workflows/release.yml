name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME:-snapshot}"
          mkdir -p dist

          targets=(
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
            "windows amd64"
            "windows arm64"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch <<< "${target}"
            name="go-grip_${version}_${goos}_${goarch}"
            binary="go-grip"
            archive="${name}.tar.gz"

            if [[ "${goos}" == "windows" ]]; then
              binary="go-grip.exe"
              archive="${name}.zip"
            fi

            workdir="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${workdir}/${binary}" \
              .

            cp LICENSE README.md "${workdir}/"

            if [[ "${goos}" == "windows" ]]; then
              (cd "${workdir}" && zip -q "../${archive}" "${binary}" LICENSE README.md)
              mv "$(dirname "${workdir}")/${archive}" "dist/${archive}"
            else
              tar -C "${workdir}" -czf "dist/${archive}" "${binary}" LICENSE README.md
            fi

            rm -rf "${workdir}"
          done

          (cd dist && sha256sum * > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-app:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build GoGrip.app
        run: |
          xcodebuild -project macos/GoGrip.xcodeproj \
            -scheme GoGrip -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/GoGrip.xcarchive

      - name: Create DMG
        run: |
          mkdir -p dmg-root
          cp -R build/GoGrip.xcarchive/Products/Applications/GoGrip.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "GoGrip" -srcfolder dmg-root \
            -ov -format UDZO GoGrip.dmg

      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: GoGrip.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
