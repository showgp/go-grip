name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: mise run build

      - name: Run tests
        run: mise run test

      - name: Format
        run: |
          DIFF="$(gofmt -d .)"
          if [[ -n $DIFF ]]; then
            echo "$DIFF"
            echo "please run gofmt"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2.9+ built with Go 1.26; must stay aligned when Go version changes
          version: v2.12.2

  macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run macOS host behavior suite
        run: make macos-test

      - name: Build candidate App and DMG
        run: make macos-candidate

      - name: Upload candidate App and DMG
        uses: actions/upload-artifact@v4
        with:
          name: GoGrip-macos-candidate
          path: |
            macos/.build/candidate/GoGrip-arm64.dmg
            macos/.build/candidate/GoGrip-x86_64.dmg
